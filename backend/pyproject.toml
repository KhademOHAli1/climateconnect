
[project]
name = "climateconnect-backend"
version = "2.0.0"
description = "Climate Connect Backend API"
authors = [{ name = "climateconnect-authors" }]
dependencies = [
    # Core Django stack - upgraded to Django 5.2 LTS for Python 3.12+ and performance improvements
    "Django~=5.2.10",
    "djangorestframework>=3.16.1",
    "django-cors-headers>=4.7.0",
    "django-filter>=25.2",
    "django-rest-knox>=5.0.2",
    "django-storages[azure]>=1.14.6",
    "django-timezone-field>=7.1",
    "drf-spectacular>=0.29.0",

    # Database - psycopg2-binary for PostGIS compatibility (psycopg3 not yet fully supported by PostGIS)
    # Note: psycopg3 has better async support but PostGIS adapter needs psycopg2
    "psycopg2-binary>=2.9.10",

    # Async/WebSocket support - upgraded Channels 4.x with Redis
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.1",

    # Caching & Message Queue
    "django-redis>=6.0.0",
    "redis>=7.1.0",
    "hiredis>=3.3.0",
    "celery>=5.6.2",
    "django-celery-beat>=2.8.1",

    # Azure Storage
    "azure-storage-blob>=12.28.0",
    "azure-core>=1.32.0",

    # Performance optimizations
    "orjson>=3.11.6",
    "uvicorn[standard]>=0.40.0",
    "uvloop>=0.22.1",
    "httptools>=0.7.0",
    "watchfiles>=1.1.1",
    "gunicorn>=24.1.1",

    # Image processing
    "Pillow>=12.1.0",

    # Data processing
    "numpy>=2.2.0",
    "pandas>=2.2.0",

    # HTTP client - async support
    "httpx>=0.28.1",
    "requests>=2.32.3",

    # Email
    "mailjet-rest>=1.3.4",

    # Monitoring & Error tracking
    "sentry-sdk[django,celery]>=2.51.0",
    "loguru>=0.7.3",

    # Utilities
    "python-dotenv>=1.1.0",
    "python-dateutil>=2.9.0",
    "PyYAML>=6.0.2",
    "shortuuid>=1.0.13",
    "validators>=0.35.0",
    "user-agents>=2.2.0",
    "cryptography>=46.0.0",

    # Testing (keep in main deps for CI)
    "factory-boy>=3.3.3",
    "Faker>=40.0.0",

    # Code formatting (keep black for compatibility during transition)
    "black>=25.1.0",

    # Deployment & Runtime dependencies
    "wheel",
    "asgiref>=3.8.1",
    "Twisted>=24.11.0",
    "pyOpenSSL>=25.0.0",
    "service-identity>=24.2.0",
    "websockets>=15.0",

    # Transitive dependencies pinned for deployment stability
    "certifi>=2024.12.14",
    "urllib3>=2.3.0",
    "charset-normalizer>=3.4.1",
    "idna>=3.10",
    "typing-extensions>=4.13.0",
    "tzdata>=2025.1",
    "sqlparse>=0.5.3",

    # Celery dependencies
    "kombu>=5.5.0",
    "billiard>=4.2.1",
    "amqp>=5.3.1",
    "vine>=5.1.0",

    # Click ecosystem (for Celery CLI)
    "click>=8.1.8",
    "click-didyoumean>=0.3.1",
    "click-plugins>=1.1.1",
    "click-repl>=0.3.0",
    "prompt-toolkit>=3.0.50",

    # Async support
    "async-timeout>=5.0.1",
    "attrs>=25.1.0",

    # Channels/Twisted dependencies
    "autobahn>=24.4.2",
    "Automat>=24.8.1",
    "constantly>=23.10.4",
    "hyperlink>=21.0.0",
    "txaio>=23.1.1",
    "zope-interface>=7.2.0",

    # Misc utilities for deployment
    "msgpack>=1.1.0",
    "python-crontab>=3.2.0",
    "cffi>=1.17.1",
    "pycparser>=2.22",
    "six>=1.17.0",
    "wcwidth>=0.2.13",
]
requires-python = ">=3.12"
license = { text = "AGPL" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.ruff]
extend-exclude = ['*/migrations']
# not sure why, but the pipline does not recognize lint.igore,
# might be due to different ruff versions
# lint.ignore = [
ignore = [
    'E501', # since black does not format all long lines (e.g. comments, disable this lint)
    'F541', # f-strings without placeholder
]

# same here: it can not recognize lint.select (version issues?)
# [tool.ruff.lint.per-file-ignores]

# Ignore `F401` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[tool.ruff.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.black]
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
# ^/foo.py  # exclude a file named foo.py in the root of the project (in addition to the defaults)
^.*\b(migrations)\b.*$
'''

[tool.pdm.dev-dependencies]
dev = [
    "ruff>=0.14.14",
    "django-debug-toolbar>=5.0.1",
    "pytest>=8.3.5",
    "pytest-django>=4.10.0",
    "pytest-asyncio>=0.26.0",
    "coverage>=7.8.0",
]
